<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitoreo AD7606</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      margin: 40px;
    }
    h1 { color: #333; }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background: white;
      margin: 5px auto;
      padding: 8px;
      border-radius: 6px;
      width: 60%;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Datos del AD7606</h1>
  <ul id="lista"></ul>

  <script>
    const firebaseURL = "https://practicumii-a9956-default-rtdb.firebaseio.com/datos.json";
    const lista = document.getElementById("lista");

    async function obtenerDatos() {
      try {
        const response = await fetch(firebaseURL);
        const data = await response.json();
        if (!data) return;

        lista.innerHTML = "";
        // Recorremos cada paquete
        Object.values(data).forEach(paquete => {
          paquete.forEach(muestra => {
            const li = document.createElement("li");
            const valores = muestra.canales.map((v, i) =>
              `CH${i + 1}: ${v.toFixed(3)} V`
            ).join(" | ");
            li.textContent = `[${new Date(muestra.timestamp * 1000).toLocaleTimeString()}] ${valores}`;
            lista.appendChild(li);
          });
        });

      } catch (err) {
        console.error("Error al leer datos:", err);
      }
    }

    setInterval(obtenerDatos, 2000);
  </script>
</body>
</html>
