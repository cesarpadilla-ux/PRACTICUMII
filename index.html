<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Visualización AD7606 – Tiempo Real</title>

    <!-- Librería Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <!-- Chart.js para graficación -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>Visualización en Tiempo Real – AD7606</h1>

<canvas id="chart" height="120"></canvas>

<script>
/* ============================================================
   CONFIGURACIÓN FIREBASE
   ============================================================ */
const firebaseConfig = {
    databaseURL: "https://practicumii-a9956-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   CONFIGURACIÓN DE LA GRÁFICA
   ============================================================ */
const MAX_POINTS = 500; // ~10 s si muestreas a 50 Hz

const ctx = document.getElementById("chart").getContext("2d");
const chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [
            { label: "Canal 1", data: [], borderWidth: 1 },
            { label: "Canal 2", data: [], borderWidth: 1 },
            { label: "Canal 3", data: [], borderWidth: 1 },
            { label: "Canal 4", data: [], borderWidth: 1 },
            { label: "Canal 5", data: [], borderWidth: 1 }
        ]
    },
    options: {
        responsive: true,
        animation: false,
        scales: {
            x: { display: false },
            y: { min: -10, max: 10 }
        }
    }
});

/* ============================================================
   LECTURA DE DATOS DESDE FIREBASE
   ============================================================ */
db.ref("ad7606/data").on("value", snapshot => {
    const value = snapshot.val();

    if (!value) return;

    const voltajes = value.split(",").map(Number); // CSV → lista

    const now = new Date().toLocaleTimeString();

    chart.data.labels.push(now);

    // Agregar 5 canales (si tu Raspberry envía 8, puedo ajustar)
    for (let i = 0; i < 5; i++) {
        chart.data.datasets[i].data.push(voltajes[i] || 0);
    }

    // Mantener tamaño
    if (chart.data.labels.length > MAX_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(d => d.data.shift());
    }

    chart.update();
});
</script>

</body>
</html>
