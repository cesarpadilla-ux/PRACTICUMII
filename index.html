<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor ECG / PPG</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* BOTÓN DEL MENÚ */
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            font-size: 30px;
            background: white;
            border: 2px solid #333;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* MENÚ LATERAL */
        .sidebar {
            width: 240px;
            height: 100%;
            background: #222;
            color: white;
            padding-top: 60px;
            position: fixed;
            top: 0;
            left: 0;
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .sidebar.hidden {
            transform: translateX(-260px);
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }

        .sidebar li:hover {
            background: #444;
        }

        /* CONTENIDO */
        #content {
            margin-left: 0;
            padding: 20px;
        }

        .titulo {
            text-align: center;
            margin-top: 60px;
            font-size: 26px;
            font-weight: bold;
        }

        #grafica {
            width: 95vw;
            height: 60vh;
            margin: auto;
            max-width: 1200px;
        }
    </style>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

    <!-- BOTÓN PARA MOSTRAR EL MENÚ -->
    <button id="menu-toggle" class="menu-btn">☰</button>

    <!-- MENÚ LATERAL -->
    <nav id="sidebar" class="sidebar hidden">
        <h2 style="text-align:center;">Opciones</h2>
        <ul>
            <li onclick="mostrarECG()">ECG</li>
            <li onclick="mostrarPPG1()">PPG 1</li>
            <li onclick="mostrarPPG2()">PPG 2</li>
            <li onclick="mostrarPPG3()">PPG 3</li>
            <li onclick="mostrarPPG4()">PPG 4</li>
        </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="content">

        <h1 class="titulo">Visor Señales ECG / PPG</h1>

        <div id="grafica"></div>

    </main>

    <script>
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("menu-toggle");

        // ABRIR / CERRAR MENÚ
        toggleBtn.addEventListener("click", () => {
            sidebar.classList.toggle("hidden");
        });

        // GENERAR GRÁFICA VACÍA
        Plotly.newPlot("grafica", [{
            x: [],
            y: [],
            mode: "lines",
            line: { width: 2 }
        }], {
            title: "Selecciona una señal en el menú",
            responsive: true
        });

        // FUNCIÓN GENERAL PARA DIBUJAR
        function graficar(x, y, titulo) {
            Plotly.react("grafica", [{
                x: x,
                y: y,
                mode: "lines",
                line: { width: 2 }
            }], {
                title: titulo,
                responsive: true,
                hovermode: "closest"  // ← muestra X,Y al pasar el mouse
            });
        }

        // ----------------------------
        // GENERADOR DE DATOS DE EJEMPLO
        // ----------------------------
        function generarDatos() {
            let x = [], y = [];
            for (let i = 0; i < 500; i++) {
                x.push(i);
                y.push(Math.sin(i / 20) + (Math.random() - 0.5) * 0.1);
            }
            return { x, y };
        }

        // ----------------------------
        // OPCIONES DEL MENÚ
        // ----------------------------
        function mostrarECG() {
            let d = generarDatos();
            graficar(d.x, d.y, "ECG");
        }

        function mostrarPPG1() {
            let d = generarDatos();
            graficar(d.x, d.y, "PPG 1");
        }

        function mostrarPPG2() {
            let d = generarDatos();
            graficar(d.x, d.y, "PPG 2");
        }

        function mostrarPPG3() {
            let d = generarDatos();
            graficar(d.x, d.y, "PPG 3");
        }

        function mostrarPPG4() {
            let d = generarDatos();
            graficar(d.x, d.y, "PPG 4");
        }
    </script>

</body>
</html>
