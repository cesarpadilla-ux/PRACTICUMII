<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Señales en tiempo real - Practicum II</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 800px;
    }
    canvas {
      width: 100%;
      height: 400px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center;">📈 Señal en tiempo real (Firebase)</h2>
    <canvas id="signalChart"></canvas>
  </div>

  <script type="module">
    // Configuración de Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://practicumii-a9956-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const refData = ref(db, "signal");

    // Configurar el gráfico
    const ctx = document.getElementById("signalChart").getContext("2d");
    const dataBuffer = [];
    const maxPoints = 200;

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: Array(maxPoints).fill(""),
        datasets: [{
          label: "Voltaje (V)",
          data: Array(maxPoints).fill(0),
          borderColor: "rgba(54, 162, 235, 1)",
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        animation: false,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    // 🔹 Control de actualización fluida
    let lastUpdate = 0;
    const updateInterval = 100; // ms

    onValue(refData, (snapshot) => {
      const val = snapshot.val();
      if (!val) return;

      const now = Date.now();
      if (now - lastUpdate > updateInterval) {
        dataBuffer.push(val);
        if (dataBuffer.length > maxPoints) dataBuffer.shift();

        chart.data.datasets[0].data = dataBuffer;
        chart.update("none"); // sin animación brusca
        lastUpdate = now;
      }
    });
  </script>
</body>
</html>
