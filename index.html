<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AD7606 - Últimas 3000 muestras</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  h2 { text-align: center; }
  canvas { display: block; margin: 20px auto; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>AD7606 - Últimas 1400 muestras</h2>

<canvas id="ch1" width="1000" height="200"></canvas>
<canvas id="ch2" width="1000" height="200"></canvas>
<canvas id="ch3" width="1000" height="200"></canvas>
<canvas id="ch4" width="1000" height="200"></canvas>
<canvas id="ch5" width="1000" height="200"></canvas>

<script>
const FIREBASE_URL = "https://practicumii-a9956-default-rtdb.firebaseio.com/ad7606.json";
const BUFFER_SIZE = 1400; // Mantener siempre 1400 muestras visibles
const CHANNELS = ["CH1","CH2","CH3","CH4","CH5"];
const COLORS = ["red","blue","green","orange","purple"];

// Función para traer los datos de Firebase
async function fetchData() {
    const res = await fetch(FIREBASE_URL);
    const data = await res.json();
    return data;
}

// Función para crear las gráficas
async function createCharts() {
    const data = await fetchData();
    
    CHANNELS.forEach((ch, i) => {
        // Rellenar con null al inicio si hay menos de 3000 muestras
        let paddedData = Array(BUFFER_SIZE - data[ch].length).fill(null).concat(data[ch]);
        let labels = Array(BUFFER_SIZE).fill(null).map((_, idx) => idx);

        const ctx = document.getElementById(`ch${i+1}`).getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: ch,
                    data: paddedData,
                    borderColor: COLORS[i],
                    fill: false,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    x: {
                        title: { display: true, text: 'Muestras' },
                        ticks: { maxTicksLimit: 10 } // Menos marcas para que no se amontonen
                    },
                    y: {
                        title: { display: true, text: 'Voltaje (V)' },
                        min: -10,  // Escala fija
                        max: 10
                    }
                }
            }
        });
    });
}

// Ejecutar creación de gráficas al cargar la página
createCharts();
</script>

</body>
</html>
