<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo en Vivo - AD7606</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; text-align: center; background: #f9f9f9; }
    canvas { max-width: 800px; margin: 30px auto; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
  </style>
</head>
<body>
  <h1>📡 Señales en vivo desde la Raspberry Pi</h1>
  <canvas id="grafica"></canvas>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      databaseURL: "https://practicumii-a9956-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Configurar gráfico
    const ctx = document.getElementById("grafica").getContext("2d");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [
          { label: "Canal 1", borderColor: "red", data: [] },
          { label: "Canal 2", borderColor: "blue", data: [] },
          { label: "Canal 3", borderColor: "green", data: [] },
          { label: "Canal 4", borderColor: "orange", data: [] },
          { label: "Canal 5", borderColor: "purple", data: [] }
        ]
      },
      options: {
        animation: false,
        scales: {
          y: { min: -10, max: 10, title: { display: true, text: "Voltaje (V)" } },
          x: { display: false }
        }
      }
    });

    // Escuchar datos en vivo
    db.ref("datos").limitToLast(50).on("child_added", snapshot => {
      const d = snapshot.val();
      const voltajes = d.canales;
      chart.data.labels.push("");
      for (let i = 0; i < 5; i++) {
        chart.data.datasets[i].data.push(voltajes[i]);
        if (chart.data.datasets[i].data.length > 50) chart.data.datasets[i].data.shift();
      }
      chart.update();
    });
  </script>
</body>
</html>
