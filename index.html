<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturas AD7606 en Tiempo Real</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    canvas {
      max-width: 900px;
      margin-top: 30px;
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Señal del AD7606 en Tiempo Real</h1>
  <canvas id="chart"></canvas>

  <script type="module">
    // ==========================
    // 🔥 CONFIGURA TU FIREBASE
    // ==========================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "tu-proyecto.firebaseapp.com",
      databaseURL: "https://tu-proyecto.firebaseio.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "ecg_data");

    // ==========================
    // 📈 CONFIGURAR GRÁFICA
    // ==========================
    const ctx = document.getElementById("chart").getContext("2d");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Canal 1 (V)",
          data: [],
          borderColor: "blue",
          borderWidth: 1,
          pointRadius: 0,
          fill: false,
          tension: 0
        }]
      },
      options: {
        animation: false,
        scales: {
          y: { beginAtZero: true, min: -10, max: 10 }
        }
      }
    });

    // ==========================
    // 📡 ESCUCHAR NUEVOS DATOS
    // ==========================
    onChildAdded(dataRef, (snapshot) => {
      const data = snapshot.val();
      const voltages = data.values;
      if (voltages && voltages.length > 0) {
        chart.data.labels.push("");
        chart.data.datasets[0].data.push(voltages[0]); // Canal 1

        if (chart.data.labels.length > 200) { // limitar muestras
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.update();
      }
    });
  </script>
</body>
</html>
