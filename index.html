<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor Señales ECG / PPG</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            overflow-x: hidden;
        }

        /* ─────────────── NAV SUPERIOR ─────────────── */
        .navbar {
            width: 100%;
            background: #111;
            color: white;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        /* ─────────────── BOTÓN HAMBURGUESA ─────────────── */
        #menu-btn {
            position: fixed;
            top: 13px;
            left: 15px;
            width: 35px;
            height: 35px;
            background: #111;
            color: white;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 1100;
        }

        /* ─────────────── MENÚ LATERAL ─────────────── */
        #sidebar {
            position: fixed;
            top: 0;
            left: -260px; /* HIDDEN */
            width: 250px;
            height: 100%;
            background: white;
            padding-top: 70px;
            box-shadow: 3px 0 6px rgba(0, 0, 0, 0.2);
            transition: left 0.3s ease;
            z-index: 1050;
        }

        #sidebar.show {
            left: 0; /* VISIBLE */
        }

        .menu-item {
            padding: 16px;
            margin: 10px;
            background: #e9e9e9;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease;
        }

        .menu-item:hover {
            background: #d5d5d5;
        }

        /* ─────────────── CONTENIDO ─────────────── */
        .content {
            margin-top: 80px;
            padding: 20px;
            margin-left: 0;
            transition: margin-left 0.3s ease;
        }

        /* En pantallas grandes el menú está siempre visible */
        @media (min-width: 900px) {
            #sidebar {
                left: 0;
            }
            #menu-btn {
                display: none;
            }
            .content {
                margin-left: 260px;
            }
        }

        /* Gráficas responsivas reales */
        .chart-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>

    <div class="navbar">Visor Señales ECG / PPG</div>

    <!-- Botón hamburguesa -->
    <div id="menu-btn">&#9776;</div>

    <!-- MENÚ LATERAL -->
    <div id="sidebar">
        <div class="menu-item" onclick="showSection('instrucciones')">Instrucciones</div>
        <div class="menu-item" onclick="showSection('ecgppg')">ECG y PPG</div>
        <div class="menu-item" onclick="showSection('ecg')">ECG</div>
        <div class="menu-item" onclick="showSection('ppg_manos')">PPG Manos</div>
        <div class="menu-item" onclick="showSection('ppg_pies')">PPG Pies</div>
        <div class="menu-item" onclick="showSection('comparacion')">Comparación</div>
    </div>

    <!-- CONTENIDO -->
    <div class="content">

        <!-- INSTRUCCIONES -->
        <div id="instrucciones" class="section">
            <h2>Instrucciones del Dispositivo</h2>
            <p><b>Encendido:</b> Conecte la alimentación...</p>
        </div>

        <!-- ECG + PPG -->
        <div id="ecgppg" class="section" style="display: none;">
            <h2>ECG y PPG</h2>
            <div class="chart-container"><canvas id="chart-ecgppg"></canvas></div>
        </div>

        <!-- ECG -->
        <div id="ecg" class="section" style="display: none;">
            <h2>ECG</h2>
            <div class="chart-container"><canvas id="chart-ecg"></canvas></div>
        </div>

        <!-- PPG MANOS -->
        <div id="ppg_manos" class="section" style="display: none;">
            <h2>PPG Manos</h2>
            <div class="chart-container"><canvas id="chart-ppg-manos"></canvas></div>
        </div>

        <!-- PPG PIES -->
        <div id="ppg_pies" class="section" style="display: none;">
            <h2>PPG Pies</h2>
            <div class="chart-container"><canvas id="chart-ppg-pies"></canvas></div>
        </div>

        <!-- COMPARACIÓN -->
        <div id="comparacion" class="section" style="display: none;">
            <h2>Comparación de Índices</h2>
            <div class="chart-container"><canvas id="chart-comparacion1"></canvas></div>

            <h2>Comparación Hallux</h2>
            <div class="chart-container"><canvas id="chart-comparacion2"></canvas></div>
        </div>

    </div>

    <script>
        /* ───────── MENÚ ───────── */
        const sidebar = document.getElementById("sidebar");
        const menuBtn = document.getElementById("menu-btn");

        menuBtn.onclick = () => {
            sidebar.classList.toggle("show");
        };

        function showSection(id) {
            let sections = document.querySelectorAll(".section");
            sections.forEach(sec => sec.style.display = "none");

            document.getElementById(id).style.display = "block";

            // Cerrar menú en móviles
            if (window.innerWidth < 900) {
                sidebar.classList.remove("show");
            }
        }

        /* ───────── CONFIGURACIÓN DE GRÁFICAS ───────── */
        const options = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { title: { display: true, text: "Tiempo (s)" }},
                y: { title: { display: true, text: "Voltaje (V)" }}
            },
            plugins: {
                tooltip: { enabled: true }
            }
        };

        /* Datos temporales (REEMPLAZARÁS ESTO CON TUS SEÑALES) */
        const dummyX = Array.from({length: 100}, (_, i) => i * 0.01);
        const dummyY = dummyX.map(x => Math.sin(10*x));

        function crearGrafica(id, color="red") {
            new Chart(document.getElementById(id), {
                type: "line",
                data: {
                    labels: dummyX,
                    datasets: [{
                        label: "Señal",
                        data: dummyY,
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: options
            });
        }

        /* CREAR TODAS LAS GRÁFICAS */
        crearGrafica("chart-ecgppg");
        crearGrafica("chart-ecg");
        crearGrafica("chart-ppg-manos");
        crearGrafica("chart-ppg-pies");

        crearGrafica("chart-comparacion1", "blue");
        crearGrafica("chart-comparacion2", "green");
    </script>

</body>
</html>
