<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AD7606 Gráficas</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h2>Últimas 3000 muestras AD7606</h2>

<canvas id="ch1" width="800" height="150"></canvas>
<canvas id="ch2" width="800" height="150"></canvas>
<canvas id="ch3" width="800" height="150"></canvas>
<canvas id="ch4" width="800" height="150"></canvas>
<canvas id="ch5" width="800" height="150"></canvas>

<script>
const dbURL = "https://practicumii-a9956-default-rtdb.firebaseio.com/ad7606.json";

async function fetchData() {
    const res = await fetch(dbURL);
    const data = await res.json();
    return data;
}

async function createCharts() {
    const data = await fetchData();
    const channels = ["CH1","CH2","CH3","CH4","CH5"];
    channels.forEach((ch, i) => {
        const ctx = document.getElementById(`ch${i+1}`).getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data[ch].map((_, idx) => idx),
                datasets: [{
                    label: ch,
                    data: data[ch],
                    borderColor: 'red',
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive:true,
                animation:false,
                scales:{
                    x:{title:{display:true, text:'Muestras'}},
                    y:{title:{display:true, text:'Voltaje (V)'}}
                }
            }
        });
    });
}

createCharts();
</script>
</body>
</html>
